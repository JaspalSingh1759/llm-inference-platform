# Argo Workflows (chart argo/argo-workflows 2.0.13, Argo v4.1.5) for the local cluster.
controller:
  workflowNamespaces: [mlops]          # the controller runs workflows only in mlops
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# The service account pipeline pods run as, with the minimum the Argo executor needs.
workflow:
  serviceAccount:
    create: true
    name: trainer
  rbac:
    create: true

server:
  # Local only: the UI trusts everyone who can port-forward to it. On EKS: SSO (P11).
  authModes: [server]
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Where files passed between steps are kept: the local S3 store, under s3://mlops/argo/.
useStaticCredentials: true
artifactRepository:
  s3:
    bucket: mlops
    endpoint: s3.mlops.svc.cluster.local:8333
    insecure: true                      # plain HTTP inside the cluster; S3 over TLS on EKS
    region: us-east-1
    addressingStyle: path
    keyFormat: "argo/{{workflow.name}}/{{pod.name}}"
    accessKeySecret: {name: s3-trainer, key: AWS_ACCESS_KEY_ID}
    secretKeySecret: {name: s3-trainer, key: AWS_SECRET_ACCESS_KEY}
