# P2 storage + registry in the local cluster (namespace mlops):
#   s3        SeaweedFS, an S3-compatible store (S3 itself on EKS). Buckets: mlops (pipeline), models (published models)
#   postgres  MLflow's database (RDS on EKS)
#   mlflow    tracking server + model registry; its files go to s3://mlops/mlflow
# Secrets (S3 keys, database password) are created by training/scripts/secrets.sh, never stored in Git.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: s3-data, namespace: mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 4Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: mlops, labels: {app.kubernetes.io/name: s3}}
spec:
  replicas: 1
  strategy: {type: Recreate}          # one writer per volume
  selector: {matchLabels: {app.kubernetes.io/name: s3}}
  template:
    metadata: {labels: {app.kubernetes.io/name: s3}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: [weed]
          # All-in-one: master + volume + filer + S3 gateway in one process (fine for a laptop).
          args: [server, -dir=/data, -ip=127.0.0.1, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=100,
                 -volume.max=100, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json]
          ports: [{name: s3, containerPort: 8333}]
          readinessProbe: {tcpSocket: {port: s3}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: s3-data}}
        - {name: tmp, emptyDir: {}}
        - {name: config, secret: {secretName: seaweedfs-s3-config}}   # who may do what in which bucket
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: mlops}
spec:
  selector: {app.kubernetes.io/name: s3}
  ports: [{name: s3, port: 8333, targetPort: s3}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: mlops, labels: {app.kubernetes.io/name: postgres}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999}   # the image's postgres user
      containers:
        - name: postgres
          image: postgres:16.6
          env:
            - {name: POSTGRES_USER, value: mlflow}
            - {name: POSTGRES_DB, value: mlflow}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-creds, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, mlflow]}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgres-data}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mlops}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops, labels: {app.kubernetes.io/name: mlflow}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mlflow}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mlflow}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      initContainers:
        # MLflow sets up its database connection once at start; if PostgreSQL isn't up yet, the registry
        # stays broken (HTTP 500) until a restart. So wait for the database first.
        - name: wait-for-postgres
          image: postgres:16.6
          command: [sh, -c, "until pg_isready -h postgres -U mlflow; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: mlflow
          image: mlflow:dev
          imagePullPolicy: IfNotPresent
          command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1", --serve-artifacts]
          workingDir: /tmp     # MLflow's internal client creates an (unused) ./mlruns folder; keep it off the read-only root
          env:
            - {name: PG_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-creds, key: password}}}
            # Read by `mlflow server` instead of command-line flags, so the password isn't in the pod spec.
            - {name: MLFLOW_BACKEND_STORE_URI, value: "postgresql://mlflow:$(PG_PASSWORD)@postgres:5432/mlflow"}
            # The server also uses MLflow's client code internally (e.g. to resolve models:/ links when a version
            # is registered). Without this it looks for models in a local ./mlruns folder and registration fails (HTTP 500).
            - {name: MLFLOW_TRACKING_URI, value: "postgresql://mlflow:$(PG_PASSWORD)@postgres:5432/mlflow"}
            - {name: MLFLOW_ARTIFACTS_DESTINATION, value: s3://mlops/mlflow}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://s3:8333"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          envFrom:
            - secretRef: {name: s3-trainer}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  selector: {app.kubernetes.io/name: mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
