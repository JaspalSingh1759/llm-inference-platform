# P2 training pipeline: raw export → prepared dataset → validated → trained + gated → compared with the
# champion → published. One pod per step, all from the trainer image. A step that exits non-zero stops
# the run, and production keeps its current model.
#
# Run it:  make train RAW=claims-2026-11.csv
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: train-classifier
  namespace: mlops
spec:
  serviceAccountName: trainer
  entrypoint: pipeline
  arguments:
    parameters:
      - name: raw                       # file under raw/ in the store, e.g. claims-2026-11.csv
      - name: eval-raw                  # shared evaluation set for comparing models trained on different data
        value: golden-2026.csv
      - name: model-name                # another team could reuse this template for its own model
        value: dispute-classifier
  ttlStrategy:
    secondsAfterCompletion: 172800      # keep finished runs (and their pods' logs) for 2 days
  securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
  volumes:
    - {name: work, emptyDir: {}}
    - {name: tmp, emptyDir: {}}

  # Settings shared by every step's container.
  templateDefaults:
    container:
      image: trainer:dev
      imagePullPolicy: IfNotPresent     # loaded into kind, never pulled
      env:
        - {name: MODEL_NAME, value: "{{workflow.parameters.model-name}}"}
        - {name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000"}
        - {name: S3_ENDPOINT_URL, value: "http://s3:8333"}   # empty on EKS: real S3
        - {name: AWS_DEFAULT_REGION, value: us-east-1}
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: s3-trainer, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-trainer, key: AWS_SECRET_ACCESS_KEY}}}
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {memory: 1536Mi}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumeMounts:
        - {name: work, mountPath: /work}
        - {name: tmp, mountPath: /tmp}

  templates:
    - name: pipeline
      steps:
        - - name: prepare
            template: prepare
        - - name: validate
            template: validate
            arguments:
              parameters: [{name: dataset, value: "{{steps.prepare.outputs.parameters.dataset}}"}]
        - - name: train
            template: train
            arguments:
              parameters: [{name: dataset, value: "{{steps.prepare.outputs.parameters.dataset}}"}]
        - - name: compare
            template: compare
            arguments:
              parameters: [{name: version, value: "{{steps.train.outputs.parameters.version}}"}]
        - - name: publish
            template: publish
            when: "{{steps.compare.outputs.parameters.promoted}} == true"   # skipped when there's nothing new
            arguments:
              parameters: [{name: version, value: "{{steps.train.outputs.parameters.version}}"}]
              artifacts: [{name: package, from: "{{steps.train.outputs.artifacts.package}}"}]

    - name: prepare
      container:
        command: [python, prepare.py, --raw, "raw/{{workflow.parameters.raw}}", --version-file, /work/dataset-version]
      outputs:
        parameters: [{name: dataset, valueFrom: {path: /work/dataset-version}}]

    - name: validate
      inputs:
        parameters: [{name: dataset}]
      container:
        command: [python, validate.py, "{{inputs.parameters.dataset}}"]

    - name: train
      inputs:
        parameters: [{name: dataset}]
      # Retry what an interruption looks like: a system error (pod lost, node gone) or a killed process
      # (exit 137: SIGKILL, e.g. a spot node shutting down or an out-of-memory kill). A failed gate exits 1
      # and is never retried: running it again would give the same answer.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        expression: 'lastRetry.status == "Error" || lastRetry.exitCode == "137"'
        backoff: {duration: 5s}
      container:
        command: [python, train.py, --data, "{{inputs.parameters.dataset}}", --out, /work/out]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {memory: 3Gi}
      outputs:
        parameters: [{name: version, valueFrom: {path: /work/out/registry_version}}]
        artifacts: [{name: package, path: /work/out}]   # model.joblib + metadata.json, handed to publish

    - name: compare
      inputs:
        parameters: [{name: version}]
      container:
        command: [python, compare.py, --version, "{{inputs.parameters.version}}", --eval-raw, "raw/{{workflow.parameters.eval-raw}}",
                  --result, /work/promoted]
      outputs:
        parameters: [{name: promoted, valueFrom: {path: /work/promoted}}]

    - name: publish
      inputs:
        parameters: [{name: version}]
        artifacts: [{name: package, path: /work/package}]
      container:
        command: [python, publish.py, /work/package, --version, "{{inputs.parameters.version}}"]
