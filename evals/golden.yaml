  - {id: nr-05, type: not_received, tags: [hard], text: "package says delivered but it's not here, neighbours don't have it either"}
  - {id: nr-06, type: not_received, tags: [hard], text: "Booked a cooking class, paid in full, the company stopped answering and the class never happened."}
  - {id: nr-07, type: not_received, tags: [hard], text: "The seller promised the bike by the 10th, it's the 25th, and I was charged in full."}
  - {id: nr-08, type: not_received, tags: [pii], text: "Order 99812 for a laptop never arrived, charged to card 3714 4963 5398 431. Ship address 22 Elm St, Toronto."}
