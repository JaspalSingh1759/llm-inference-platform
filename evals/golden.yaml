  # ── unauthorised ───────────────────────────────────────────────────
  - {id: una-01, type: unauthorised, tags: [clear], text: "There is a payment of 812 dollars at a store in Lisbon that I never made."}
  - {id: una-02, type: unauthorised, tags: [clear], text: "I see three online purchases this morning that I did not make."}
  - {id: una-03, type: unauthorised, tags: [clear], text: "Someone used my card at a gas station in another city while I was at home."}
  - {id: una-04, type: unauthorised, tags: [clear], text: "My wallet was stolen yesterday and there are charges I don't recognise."}
