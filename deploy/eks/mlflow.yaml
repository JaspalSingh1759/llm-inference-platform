# P5: MLflow on EKS. Same image and settings as on kind (training/mlops.yaml), but its database is RDS and its
# files go to the real mlops bucket through Pod Identity (service account mlflow). The database URI (with the
# password RDS generated) is put in the mlflow-db Secret by deploy/eks/install-training.sh, never in Git.
apiVersion: v1
kind: ServiceAccount
metadata: {name: mlflow, namespace: mlops}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops, labels: {app.kubernetes.io/name: mlflow}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mlflow}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mlflow}}
    spec:
      serviceAccountName: mlflow
      priorityClassName: serving         # platform service: wins over training pods (P5 part 3)
      nodeSelector: {node-role: system}
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: mlflow
          image: 352184619391.dkr.ecr.us-east-1.amazonaws.com/llm-platform/mlflow:fe78dd5
          command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1", --serve-artifacts]
          workingDir: /tmp
          env:
            - {name: MLFLOW_BACKEND_STORE_URI, valueFrom: {secretKeyRef: {name: mlflow-db, key: uri}}}
            - {name: MLFLOW_TRACKING_URI, valueFrom: {secretKeyRef: {name: mlflow-db, key: uri}}}
            - {name: MLFLOW_ARTIFACTS_DESTINATION, value: s3://llm-platform-mlops-352184619391/mlflow}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  selector: {app.kubernetes.io/name: mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
