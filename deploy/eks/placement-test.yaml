# P4 check: the taint keeps ordinary pods off the LLM nodes, and a pod that tolerates it lands there.
#   kubectl apply -f deploy/eks/placement-test.yaml && kubectl get pods -n placement-test -o wide
apiVersion: v1
kind: Namespace
metadata: {name: placement-test}
---
# Tolerates the taint AND asks for an LLM node: must land on node-role=llm.
apiVersion: v1
kind: Pod
metadata: {name: wants-llm-node, namespace: placement-test}
spec:
  nodeSelector: {node-role: llm}
  tolerations:
    - {key: workload, operator: Equal, value: llm, effect: NoSchedule}
  containers:
    - {name: pause, image: registry.k8s.io/pause:3.10, resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
# No toleration: the scheduler must keep it off the LLM nodes (it lands on a system node).
apiVersion: v1
kind: Pod
metadata: {name: ordinary, namespace: placement-test}
spec:
  containers:
    - {name: pause, image: registry.k8s.io/pause:3.10, resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
# Asks for an LLM node WITHOUT tolerating the taint: must stay Pending (the taint wins).
apiVersion: v1
kind: Pod
metadata: {name: no-toleration, namespace: placement-test}
spec:
  nodeSelector: {node-role: llm}
  containers:
    - {name: pause, image: registry.k8s.io/pause:3.10, resources: {requests: {cpu: 10m, memory: 16Mi}}}
