# Maple Bank (fictional) dispute policies, one per dispute type the classifier can return.
# The assistant puts the matching text into the prompt, so the LLM answers from policy, not from memory.
duplicate_charge: >-
  If a customer was charged more than once for the same purchase, we place a temporary credit for the
  extra charge within 2 business days while we confirm with the merchant. The investigation takes up to
  10 business days.
incorrect_amount: >-
  If the amount charged differs from the agreed price, the customer should send the receipt or quote.
  We dispute the difference with the merchant; the investigation takes up to 30 days. No temporary
  credit is given for differences under $25.
credit_not_processed: >-
  If a merchant promised a refund that has not arrived after 15 days, we contact the merchant on the
  customer's behalf. The customer should provide the refund confirmation or return receipt.
  The investigation takes up to 30 days.
cancelled_recurring: >-
  If a subscription keeps charging after the customer cancelled, we block future charges from that
  merchant immediately and dispute charges made after the cancellation date. The customer should provide
  the cancellation confirmation.
not_received: >-
  If goods or services were paid for but not received by the promised date, the customer must first
  contact the merchant. If there is no resolution within 7 days, we open a dispute; the investigation
  takes up to 45 days.
unauthorised: >-
  If the customer did not make or approve the transaction, we block the card immediately, issue a new
  one, and give a temporary credit within 2 business days. The customer will be asked to confirm recent
  transactions. The investigation takes up to 10 business days.
