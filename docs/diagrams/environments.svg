<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">How real projects handle environments</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Same code, different accounts and values. Each box with a dashed border is its own AWS account</text><rect x="24" y="100" width="260" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="154.0" y="134.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Git: the same code for every env</text><text x="154.0" y="151.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">terraform modules (versioned)</text><text x="154.0" y="168.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Helm charts (versioned)</text><text x="154.0" y="185.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">app images (built once)</text><rect x="330" y="85" width="280" height="470" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="344" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Dev account</text><text x="470" y="125" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">anyone on the team can apply</text><rect x="350" y="140" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="470.0" y="166.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">state bucket + CI role</text><text x="470.0" y="183.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bootstrap (created once)</text><rect x="350" y="220" width="240" height="60" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="470.0" y="246.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">network stack</text><text x="470.0" y="263.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">VPC, subnets, NAT · own state file</text><rect x="350" y="298" width="240" height="60" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="470.0" y="324.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">eks stack</text><text x="470.0" y="341.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">cluster, node groups · own state file</text><path d="M470,280 L470,296" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="376" width="240" height="60" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="470.0" y="402.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">data stack</text><text x="470.0" y="419.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">RDS, S3 (protected) · own state file</text><path d="M470,358 L470,374" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="454" width="240" height="60" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="470.0" y="480.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">addons stack</text><text x="470.0" y="497.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Argo CD, monitoring · own state file</text><path d="M470,436 L470,452" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="630" y="85" width="280" height="470" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="644" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Staging account</text><text x="770" y="125" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">a copy of prod, for final tests</text><rect x="650" y="140" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="770.0" y="166.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">state bucket + CI role</text><text x="770.0" y="183.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bootstrap (created once)</text><rect x="650" y="220" width="240" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="770.0" y="246.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">network stack</text><text x="770.0" y="263.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">VPC, subnets, NAT · own state file</text><rect x="650" y="298" width="240" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="770.0" y="324.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">eks stack</text><text x="770.0" y="341.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">cluster, node groups · own state file</text><path d="M770,280 L770,296" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="376" width="240" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="770.0" y="402.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">data stack</text><text x="770.0" y="419.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">RDS, S3 (protected) · own state file</text><path d="M770,358 L770,374" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="454" width="240" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="770.0" y="480.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">addons stack</text><text x="770.0" y="497.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Argo CD, monitoring · own state file</text><path d="M770,436 L770,452" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="930" y="85" width="280" height="470" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="944" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Prod account</text><text x="1070" y="125" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">CI only, main branch + approval</text><rect x="950" y="140" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="1070.0" y="166.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">state bucket + CI role</text><text x="1070.0" y="183.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bootstrap (created once)</text><rect x="950" y="220" width="240" height="60" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="246.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">network stack</text><text x="1070.0" y="263.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">VPC, subnets, NAT · own state file</text><rect x="950" y="298" width="240" height="60" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="324.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">eks stack</text><text x="1070.0" y="341.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">cluster, node groups · own state file</text><path d="M1070,280 L1070,296" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="950" y="376" width="240" height="60" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="402.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">data stack</text><text x="1070.0" y="419.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">RDS, S3 (protected) · own state file</text><path d="M1070,358 L1070,374" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="950" y="454" width="240" height="60" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="480.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">addons stack</text><text x="1070.0" y="497.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Argo CD, monitoring · own state file</text><path d="M1070,436 L1070,452" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284,155 L328,155" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="590" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Each stack has its own state file: a bad apply on eks can't touch network or data.</text><text x="470" y="614" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">A stack reads the one above it through SSM parameters, data sources or terraform_remote_state.</text><text x="470" y="638" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Dev credentials can't read or change anything in the prod account.</text><rect x="24" y="250" width="260" height="150" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="154.0" y="304.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Shared accounts</text><text x="154.0" y="321.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">management: billing, org rules</text><text x="154.0" y="338.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">security: audit logs from all</text><text x="154.0" y="355.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">shared services: ECR, CI runners</text><rect x="24" y="440" width="260" height="115" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="154.0" y="477.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Promotion</text><text x="154.0" y="494.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">the same image and module</text><text x="154.0" y="511.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">version moves dev → staging</text><text x="154.0" y="528.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">→ prod, after checks pass</text></svg>
