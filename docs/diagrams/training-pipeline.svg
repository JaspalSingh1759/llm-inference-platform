<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="690" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">P2 training pipeline: raw data in, a served model version out</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Each step is a pod in an Argo Workflow. A failed step stops the run, and production keeps its current model</text><rect x="24" y="115" width="170" height="100" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="109.0" y="144.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Raw data drop</text><text x="109.0" y="161.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">SeaweedFS (S3 later)</text><text x="109.0" y="178.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">raw/claims-&lt;month&gt;.csv</text><text x="109.0" y="195.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">from the data team</text><rect x="24" y="250" width="170" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="109.0" y="274.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Trigger</text><text x="109.0" y="291.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">now: make train</text><text x="109.0" y="308.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">later: new raw file,</text><text x="109.0" y="325.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">drift alert, or cron</text><path d="M194,165 L232,165" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="214" y="80" width="1002" height="260" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="228" y="100" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Argo Workflow "train-classifier": one pod per step, all from the trainer image</text><rect x="234" y="115" width="176" height="100" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="322.0" y="153.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">0 Prepare</text><text x="322.0" y="170.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">raw CSV → clean,</text><text x="322.0" y="187.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dedupe, split, version</text><path d="M410,165 L428,165" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M284,215 L284,248" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowred)"/><rect x="234" y="250" width="150" height="62" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="309.0" y="277.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">stop: unreadable</text><text x="309.0" y="294.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bad file / columns</text><rect x="430" y="115" width="176" height="100" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="3"/><text x="518.0" y="153.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">1 Validate</text><text x="518.0" y="170.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">schema, leakage,</text><text x="518.0" y="187.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">classes, file hashes</text><path d="M606,165 L624,165" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M480,215 L480,248" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowred)"/><rect x="430" y="250" width="150" height="62" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="505.0" y="277.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">stop: bad data</text><text x="505.0" y="294.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">nothing is trained</text><rect x="626" y="115" width="176" height="100" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="3"/><text x="714.0" y="153.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">2 Train + gate</text><text x="714.0" y="170.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">scikit-learn vs PyTorch,</text><text x="714.0" y="187.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">best on val, thresholds</text><path d="M802,165 L820,165" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M676,215 L676,248" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowred)"/><rect x="626" y="250" width="150" height="62" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="701.0" y="277.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">stop: gate failed</text><text x="701.0" y="294.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">saved, not registered</text><rect x="822" y="115" width="176" height="100" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="3"/><text x="910.0" y="153.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">3 Compare</text><text x="910.0" y="170.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">vs champion; same</text><text x="910.0" y="187.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">data+code = nothing new</text><path d="M998,165 L1016,165" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M872,215 L872,248" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowred)"/><rect x="822" y="250" width="150" height="62" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="897.0" y="277.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">stop: not better</text><text x="897.0" y="294.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prod model unchanged</text><rect x="1018" y="115" width="176" height="100" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="1106.0" y="153.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">4 Publish</text><text x="1106.0" y="170.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">only if promoted:</text><text x="1106.0" y="187.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">model + metadata → store</text><rect x="560" y="390" width="440" height="95" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="780.0" y="425.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">MLflow: tracking + registry</text><text x="780.0" y="442.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">every run and candidate: params, scores, dataset, commit</text><text x="780.0" y="459.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">aliases challenger / champion · PostgreSQL database</text><path d="M789,215 L789,388" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="735" y="368" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">register challenger</text><path d="M985,215 L985,388" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="931" y="368" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">promote champion</text><rect x="1030" y="390" width="186" height="95" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="1123.0" y="417.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Model store</text><text x="1123.0" y="434.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">SeaweedFS (S3 later)</text><text x="1123.0" y="451.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">models/dispute-</text><text x="1123.0" y="468.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">classifier/v&lt;N&gt;/</text><path d="M1106,215 L1106,388" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1010" y="535" width="206" height="90" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="1113.0" y="568.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GitOps commit</text><text x="1113.0" y="585.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">classifier model</text><text x="1113.0" y="602.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">version = v&lt;N&gt; (PR)</text><path d="M1106,485 L1106,533" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="530" y="535" width="360" height="90" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="3"/><text x="710.0" y="568.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Classifier pod (serving)</text><text x="710.0" y="585.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">init container downloads v&lt;N&gt; from the store;</text><text x="710.0" y="602.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">server checks sha256 + framework, then serves</text><path d="M1010,580 L892,580" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="950" y="570" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">Helm / Argo CD</text><rect x="230" y="535" width="250" height="90" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="355.0" y="568.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Assistant</text><text x="355.0" y="585.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">POST /assist gets dispute</text><text x="355.0" y="602.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">types from the new model</text><path d="M530,580 L482,580" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="657" width="16" height="16" rx="4" fill="#fef3e0" stroke="#c98a1b"/><text x="54" y="670" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Gates (a pod that can stop the run)</text><rect x="290" y="657" width="16" height="16" rx="4" fill="#e0f5f5" stroke="#1f8a8a"/><text x="314" y="670" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Data in + data processing</text><rect x="550" y="657" width="16" height="16" rx="4" fill="#e8f0fe" stroke="#4a7bd0"/><text x="574" y="670" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Storage + registry</text><rect x="810" y="657" width="16" height="16" rx="4" fill="#fde8e8" stroke="#c0392b"/><text x="834" y="670" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Where a bad run stops</text></svg>
