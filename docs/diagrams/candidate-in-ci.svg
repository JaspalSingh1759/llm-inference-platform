<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Where the candidate test runs in production: every pull request (P7)</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">A change that can affect answers is deployed next to production, scored on the golden set, and merged only if the gate passes</text><rect x="24" y="110" width="170" height="95" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="109.0" y="145.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Pull request</text><text x="109.0" y="162.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt v2, classifier v3,</text><text x="109.0" y="179.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bigger LLM, new policy</text><rect x="220" y="80" width="760" height="160" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="234" y="100" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">CI pipeline (GitHub Actions)</text><rect x="240" y="115" width="160" height="95" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="320.0" y="150.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">1 Build</text><text x="320.0" y="167.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">assistant image</text><text x="320.0" y="184.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">with the change</text><rect x="420" y="115" width="180" height="95" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="510.0" y="150.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">2 Preview env</text><text x="510.0" y="167.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">temporary namespace</text><text x="510.0" y="184.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">pr-42 = the candidate</text><rect x="620" y="115" width="160" height="95" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="700.0" y="150.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">3 Golden set</text><text x="700.0" y="167.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">60 claims through</text><text x="700.0" y="184.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">the candidate</text><polygon points="880,112 955,162 880,212 805,162" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="880" y="167" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">4 Gate</text><path d="M194,157 L238,157" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M400,162 L418,162" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M600,162 L618,162" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M780,162 L803,162" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1020" y="110" width="196" height="95" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1118.0" y="145.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">PR blocked</text><text x="1118.0" y="162.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">report attached:</text><text x="1118.0" y="179.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">"refund promises 10.7%"</text><path d="M955,162 L1018,157" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowred)"/><text x="985" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">exit 1</text><rect x="780" y="300" width="200" height="85" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="880.0" y="339.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Review + merge</text><text x="880.0" y="356.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">to main</text><path d="M880,212 L880,298" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905" y="260" font-size="12" font-weight="700" fill="#3b8a52" text-anchor="middle">exit 0</text><rect x="500" y="300" width="220" height="85" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="610.0" y="330.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Argo CD (P7)</text><text x="610.0" y="347.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">deploys main</text><text x="610.0" y="364.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(GitOps)</text><path d="M780,342 L722,342" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="220" y="300" width="220" height="85" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="330.0" y="330.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Canary (P10)</text><text x="330.0" y="347.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">5% of real traffic</text><text x="330.0" y="364.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">first, then 100%</text><path d="M500,342 L442,342" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="300" width="150" height="85" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="3"/><text x="99.0" y="339.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Customers</text><text x="99.0" y="356.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">production</text><path d="M220,342 L176,342" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="510" y="270" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">step 5: delete the preview namespace (production was never touched)</text><rect x="220" y="430" width="760" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="600.0" y="461.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Our laptop version: make eval PROMPT=x</text><text x="600.0" y="478.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">same steps by hand: helm upgrade with the candidate → run_eval.py → exit 0/1 → trap puts v1 back</text></svg>
