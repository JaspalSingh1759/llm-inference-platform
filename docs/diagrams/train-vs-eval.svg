<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Training data and the golden set never mix</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">P2 builds the classifier from generated data. P3 tests the whole running system with claims nobody trained on</text><rect x="24" y="80" width="1192" height="140" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="100" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">P2 training pipeline: "is this model good enough to publish?"</text><rect x="44" y="115" width="220" height="85" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="154.0" y="137.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Generated claims</text><text x="154.0" y="154.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">CSV exports in S3</text><text x="154.0" y="171.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(same generator for</text><text x="154.0" y="188.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">train, val and test)</text><rect x="320" y="115" width="220" height="85" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="430.0" y="145.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Train + gate</text><text x="430.0" y="162.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">scikit-learn vs PyTorch</text><text x="430.0" y="179.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">test macro-F1 0.99</text><rect x="596" y="115" width="220" height="85" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="706.0" y="145.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Model v2 published</text><text x="706.0" y="162.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">models/dispute-</text><text x="706.0" y="179.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">classifier/v2/</text><path d="M264,157 L318,157" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M540,157 L594,157" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="250" width="1192" height="160" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="270" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">P3 evaluation: "does the whole system answer real-looking claims correctly and safely?"</text><rect x="44" y="290" width="220" height="95" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="3"/><text x="154.0" y="317.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Golden set</text><text x="154.0" y="334.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">60 hand-written claims</text><text x="154.0" y="351.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">+ correct dispute type</text><text x="154.0" y="368.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">never used for training</text><rect x="596" y="290" width="360" height="95" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="776.0" y="325.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Running app (the candidate)</text><text x="776.0" y="342.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">guardrail → classifier v2 → policy →</text><text x="776.0" y="359.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt → LLM → reply</text><rect x="1010" y="290" width="186" height="95" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1103.0" y="325.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Score + gate</text><text x="1103.0" y="342.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">accuracy 0.67</text><text x="1103.0" y="359.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">exit 0 or exit 1</text><path d="M264,337 L594,337" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="430" y="327" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">sent one by one</text><path d="M956,337 L1008,337" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M706,200 L706,288" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="790" y="238" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">the model under test</text><text x="620" y="450" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">0.99 on its own test vs 0.67 on the golden set: a test from the same source as the training data flatters the model</text></svg>
