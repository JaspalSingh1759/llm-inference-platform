<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="0 0 1260 800" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1260" height="800" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">LLM inference platform on Kubernetes: what we build</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">One platform, two kinds of model: an LLM (CPU now, GPU when quota allows) and a classic ML model (scikit-learn)</text><rect x="20" y="90" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="105.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Client</text><text x="105.0" y="135.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">POST /assist</text><text x="105.0" y="152.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">a customer claim</text><path d="M190,130 L238,130" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="230" y="70" width="1020" height="470" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="244" y="90" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">EKS cluster (Terraform) · deployed by Argo CD from Git</text><rect x="250" y="95" width="190" height="90" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="3"/><text x="345.0" y="128.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Assistant API</text><text x="345.0" y="145.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">FastAPI · the app</text><text x="345.0" y="162.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">orchestrates the steps</text><rect x="490" y="95" width="190" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="585.0" y="128.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Guardrails</text><text x="585.0" y="145.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">PII masking in + out</text><text x="585.0" y="162.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt-injection check</text><path d="M440,140 L488,140" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="730" y="95" width="210" height="90" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="835.0" y="128.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">LLM gateway</text><text x="835.0" y="145.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LiteLLM · routing, keys,</text><text x="835.0" y="162.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">rate limits, cost, fallback</text><path d="M680,140 L728,140" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="990" y="95" width="240" height="90" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1110.0" y="128.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Amazon Bedrock</text><text x="1110.0" y="145.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">fallback model</text><text x="1110.0" y="162.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(when our LLM is down/busy)</text><path d="M940,125 L988,125" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="964" y="117" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">fallback</text><rect x="250" y="215" width="520" height="170" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="264" y="235" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">KServe (model serving)</text><rect x="270" y="250" width="230" height="110" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="385.0" y="284.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Classifier</text><text x="385.0" y="301.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">InferenceService · CPU</text><text x="385.0" y="318.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">scikit-learn (from B2)</text><text x="385.0" y="335.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">→ dispute type</text><rect x="520" y="250" width="230" height="110" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="3"/><text x="635.0" y="284.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">LLM</text><text x="635.0" y="301.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">InferenceService</text><text x="635.0" y="318.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">now: llama.cpp on CPU</text><text x="635.0" y="335.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">later: vLLM on GPU</text><path d="M330,185 L330,248" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="370" y="212" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">1 classify</text><path d="M835,185 L835,220 L690,220 L690,248" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="870" y="212" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">2 generate</text><rect x="1030" y="250" width="200" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="1130.0" y="284.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Policy snippets</text><text x="1130.0" y="301.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">one per dispute type</text><text x="1130.0" y="318.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(tiny RAG: picked</text><text x="1130.0" y="335.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">by the classifier)</text><rect x="800" y="250" width="200" height="110" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="900.0" y="284.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Model cache</text><text x="900.0" y="301.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">weights from S3</text><text x="900.0" y="318.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">on a volume → fast</text><text x="900.0" y="335.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">cold start</text><path d="M800,305 L752,305" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="270" y="410" width="230" height="100" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="385.0" y="448.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">System node group</text><text x="385.0" y="465.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">app, gateway,</text><text x="385.0" y="482.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">monitoring, classifier</text><rect x="520" y="410" width="230" height="100" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="635.0" y="448.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">LLM node group</text><text x="635.0" y="465.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">now: c7i.large spot (CPU)</text><text x="635.0" y="482.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">later: g4dn T4 GPU</text><rect x="800" y="410" width="200" height="100" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="900.0" y="448.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Autoscaling</text><text x="900.0" y="465.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">KEDA on LLM queue</text><text x="900.0" y="482.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">more LLM nodes on load</text><rect x="1030" y="410" width="200" height="100" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="1130.0" y="448.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Prometheus + Grafana</text><text x="1130.0" y="465.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LLM serving metrics,</text><text x="1130.0" y="482.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">tokens, cost, SLOs</text><rect x="20" y="570" width="1230" height="175" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="34" y="590" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">LLMOps loop (GitHub Actions + Git)</text><rect x="40" y="610" width="180" height="95" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="130.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Change</text><text x="130.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt, model or code</text><text x="130.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">in a PR</text><path d="M220,657 L240,657" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="242" y="610" width="180" height="95" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="3"/><text x="332.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Eval gate</text><text x="332.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">golden set: accuracy,</text><text x="332.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">faithfulness, safety</text><path d="M422,657 L442,657" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="444" y="610" width="180" height="95" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="534.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Build + scan</text><text x="534.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">image → ECR</text><text x="534.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">model → S3</text><path d="M624,657 L644,657" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="646" y="610" width="180" height="95" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="736.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GitOps commit</text><text x="736.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">new version in</text><text x="736.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">env values</text><path d="M826,657 L846,657" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="848" y="610" width="180" height="95" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="938.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Canary</text><text x="938.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">10% traffic → metrics</text><text x="938.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">+ online eval → 100%</text><path d="M1028,657 L1048,657" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1050" y="610" width="180" height="95" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="1140.0" y="645.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Trace + feedback</text><text x="1140.0" y="662.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">OpenTelemetry → Phoenix</text><text x="1140.0" y="679.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">bad answers → golden set</text><path d="M1130,705 L1130,725 L130,725 L130,707" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="630" y="740" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">every bad answer found in production becomes a new test case</text><rect x="30" y="769" width="16" height="16" rx="4" fill="#fef3e0" stroke="#c98a1b"/><text x="54" y="782" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Our app / gates</text><rect x="290" y="769" width="16" height="16" rx="4" fill="#e6f4ea" stroke="#3b8a52"/><text x="314" y="782" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Serving + scaling</text><rect x="550" y="769" width="16" height="16" rx="4" fill="#f1e8fd" stroke="#7b52c7"/><text x="574" y="782" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Gateway + delivery</text><rect x="810" y="769" width="16" height="16" rx="4" fill="#e8f0fe" stroke="#4a7bd0"/><text x="834" y="782" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">AWS / tracing</text></svg>
