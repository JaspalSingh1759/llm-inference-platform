<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="760" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">P5: serving and training on EKS, and what runs where</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Node groups by kind of work, namespaces by team, priorities decide who wins when the cluster is full</text><rect x="24" y="85" width="400" height="330" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">system nodes · 2× t3.large on-demand</text><rect x="44" y="120" width="360" height="60" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="224.0" y="146.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">assistant</text><text x="224.0" y="163.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute · Helm chart · serving</text><rect x="44" y="192" width="360" height="60" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="224.0" y="218.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">classifier (KServe)</text><text x="224.0" y="235.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute · v2 from S3 · serving</text><rect x="44" y="264" width="360" height="60" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="224.0" y="290.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">MLflow</text><text x="224.0" y="307.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops · DB on RDS · serving</text><rect x="44" y="336" width="360" height="60" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="224.0" y="362.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Argo CD, Argo Workflows,</text><text x="224.0" y="379.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">KServe, cert-manager, add-ons</text><rect x="444" y="85" width="360" height="330" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="458" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">llm node · spot c5.large (11 types)</text><rect x="464" y="120" width="320" height="60" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="624.0" y="146.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">LLM (KServe)</text><text x="624.0" y="163.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute · llama.cpp · Qwen 0.5B</text><rect x="464" y="192" width="320" height="60" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="624.0" y="218.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">taint workload=llm</text><text x="624.0" y="235.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">only the LLM tolerates it</text><rect x="464" y="264" width="320" height="60" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="624.0" y="290.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Recreate strategy</text><text x="624.0" y="307.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">one replica fills the node</text><rect x="824" y="85" width="392" height="330" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="838" y="105" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">training node · spot m5.large (11 types)</text><rect x="844" y="120" width="352" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1020.0" y="146.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">pipeline step pods</text><text x="1020.0" y="163.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops · Argo · priority training</text><rect x="844" y="192" width="352" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1020.0" y="218.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">taint workload=training</text><text x="1020.0" y="235.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">only pipeline pods</text><rect x="844" y="264" width="352" height="60" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1020.0" y="290.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">preempted by serving</text><text x="1020.0" y="307.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">when serving needs the room</text><rect x="24" y="450" width="300" height="110" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="174.0" y="484.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">S3 models bucket</text><text x="174.0" y="501.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute-classifier/v1, v2</text><text x="174.0" y="518.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(published by the EKS pipeline)</text><text x="174.0" y="535.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">llm/…/model.gguf</text><rect x="350" y="450" width="300" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="500.0" y="484.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">KServe storage initializer</text><text x="500.0" y="501.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">init container: downloads</text><text x="500.0" y="518.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">STORAGE_URI → /mnt/models</text><text x="500.0" y="535.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">with Pod Identity (no keys)</text><rect x="676" y="450" width="270" height="110" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="811.0" y="493.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">S3 mlops bucket</text><text x="811.0" y="510.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">raw/, datasets/,</text><text x="811.0" y="527.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlflow/, argo/</text><rect x="972" y="450" width="244" height="110" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="1094.0" y="484.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">RDS PostgreSQL</text><text x="1094.0" y="501.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">MLflow's database</text><text x="1094.0" y="518.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(MLflow: system nodes)</text><text x="1094.0" y="535.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">password from Secrets Mgr</text><path d="M324,505 L348,505" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M500,450 L500,416" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="600" y="436" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">before the model server starts</text><path d="M1020,416 L811,448" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="24" y="590" width="1192" height="130" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="610" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Teams (namespaces) · quotas · priorities</text><rect x="44" y="625" width="360" height="80" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="224.0" y="653.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">disputes team</text><text x="224.0" y="670.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute: CPU 3, memory 3Gi</text><text x="224.0" y="687.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops: CPU 2, memory 4Gi</text><rect x="430" y="625" width="360" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="610.0" y="653.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">team-fraud (example 2nd team)</text><text x="610.0" y="670.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">CPU 500m, memory 1Gi, GPU 0</text><text x="610.0" y="687.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">shared pipeline template, no S3 role yet</text><rect x="816" y="625" width="380" height="80" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1006.0" y="653.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">PriorityClasses</text><text x="1006.0" y="670.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">serving 100000: may preempt training</text><text x="1006.0" y="687.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">training 1000: never preempts, retried</text></svg>
