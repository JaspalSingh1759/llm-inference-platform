<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Where pods land: labels invite, taints repel</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">nodeSelector = "only run me on nodes with this label" · taint = "stay away unless you tolerate me" (make eks-check)</text><rect x="40" y="100" width="280" height="90" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="180.0" y="133.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">wants-llm-node</text><text x="180.0" y="150.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">nodeSelector node-role=llm</text><text x="180.0" y="167.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">toleration workload=llm</text><rect x="40" y="215" width="280" height="90" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="180.0" y="248.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ordinary</text><text x="180.0" y="265.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">no nodeSelector</text><text x="180.0" y="282.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">no toleration</text><rect x="40" y="330" width="280" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="180.0" y="363.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">no-toleration</text><text x="180.0" y="380.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">nodeSelector node-role=llm</text><text x="180.0" y="397.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">no toleration</text><rect x="560" y="90" width="300" height="110" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="3"/><text x="710.0" y="124.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">llm node</text><text x="710.0" y="141.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">label node-role=llm</text><text x="710.0" y="158.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">TAINT workload=llm:NoSchedule</text><text x="710.0" y="175.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">spot c7i.large</text><rect x="560" y="225" width="300" height="90" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="710.0" y="258.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">system nodes</text><text x="710.0" y="275.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">label node-role=system</text><text x="710.0" y="292.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">no taint · on-demand t3.large</text><rect x="560" y="340" width="300" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="710.0" y="373.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Pending (not scheduled)</text><text x="710.0" y="390.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">no node is both labelled llm</text><text x="710.0" y="407.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">and willing to accept it</text><path d="M320,145 L558,145" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="440" y="135" font-size="12" font-weight="700" fill="#3b8a52" text-anchor="middle">label matches + taint tolerated</text><path d="M320,260 L558,270" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="440" y="252" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">taint keeps it off the llm node</text><path d="M320,375 L558,385" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowred)"/><text x="440" y="368" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">wants llm, but the taint repels it</text><rect x="900" y="120" width="316" height="280" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="1058.0" y="188.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Why it matters</text><text x="1058.0" y="205.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Expensive nodes (LLM, GPU) run only</text><text x="1058.0" y="222.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">the workloads that need them.</text><text x="1058.0" y="239.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle"></text><text x="1058.0" y="256.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Without the taint, any pod could</text><text x="1058.0" y="273.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">fill the GPU node and keep it</text><text x="1058.0" y="290.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">alive (and billing) for nothing.</text><text x="1058.0" y="307.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle"></text><text x="1058.0" y="324.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Without the label, the LLM pod</text><text x="1058.0" y="341.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">could land on a small system node.</text></svg>
