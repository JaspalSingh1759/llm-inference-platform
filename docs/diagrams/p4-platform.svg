<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="920" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">P4: what one terraform apply builds on AWS</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Built at the start of a session (make eks-up), destroyed at the end (make eks-down). Only the P0 bootstrap stays</text><rect x="24" y="110" width="180" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="114.0" y="144.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Your laptop</text><text x="114.0" y="161.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">make eks-up / eks-down</text><text x="114.0" y="178.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">terraform + kubectl</text><text x="114.0" y="195.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(kubectl → API)</text><rect x="24" y="610" width="180" height="130" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="114.0" y="646.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P0 bootstrap</text><text x="114.0" y="663.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(never destroyed)</text><text x="114.0" y="680.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Terraform state bucket</text><text x="114.0" y="697.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">budget alert $20 / $50</text><text x="114.0" y="714.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">GitHub OIDC role</text><path d="M114,220 L114,608" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="62" y="420" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">state: platform/</text><rect x="224" y="80" width="992" height="790" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="238" y="100" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">AWS account · us-east-1</text><rect x="244" y="115" width="600" height="95" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="544.0" y="150.5" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">EKS control plane · Kubernetes 1.36 (run by AWS, $0.10/h)</text><text x="544.0" y="167.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">API server: only your IP may connect · access entries</text><text x="544.0" y="184.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Secrets encrypted with the KMS key · audit logs → CloudWatch</text><path d="M204,160 L242,160" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="244" y="235" width="620" height="615" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="258" y="255" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">VPC 10.20.0.0/16 · 2 availability zones</text><rect x="264" y="275" width="180" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="354.0" y="306.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Public subnets</text><text x="354.0" y="323.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">load balancers later (P5+)</text><rect x="584" y="275" width="260" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="714.0" y="306.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">NAT gateway</text><text x="714.0" y="323.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">private nodes → internet (image pulls)</text><rect x="264" y="370" width="580" height="465" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="278" y="390" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Private subnets (zones a + b): nodes and database, no public IPs</text><path d="M500,210 L500,408" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="360" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">runs the nodes</text><rect x="284" y="410" width="260" height="155" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="3"/><text x="414.0" y="450.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">system node group</text><text x="414.0" y="467.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">2× t3.large · ON-DEMAND</text><text x="414.0" y="484.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Argo CD</text><text x="414.0" y="501.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">CoreDNS, VPC CNI, EBS CSI,</text><text x="414.0" y="518.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Pod Identity agent</text><text x="414.0" y="535.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">assistant + classifier (P5)</text><rect x="564" y="410" width="260" height="155" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="3"/><text x="694.0" y="458.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">llm node group</text><text x="694.0" y="475.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">1–2× c7i.large · SPOT (~70% off)</text><text x="694.0" y="492.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">taint workload=llm:NoSchedule</text><text x="694.0" y="509.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">only pods that tolerate it:</text><text x="694.0" y="526.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">the LLM server (P5)</text><path d="M714,408 L714,347" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="385" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">image pulls</text><rect x="284" y="590" width="260" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="414.0" y="624.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">gpu node group (off)</text><text x="414.0" y="641.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">g4dn.xlarge spot · 0 → 1 nodes</text><text x="414.0" y="658.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">taint nvidia.com/gpu</text><text x="414.0" y="675.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">gpu_enabled = false until quota</text><rect x="564" y="590" width="260" height="110" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="694.0" y="624.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">RDS PostgreSQL 16</text><text x="694.0" y="641.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">db.t4g.micro · MLflow's database</text><text x="694.0" y="658.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">port 5432 from nodes only</text><text x="694.0" y="675.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">encrypted, password in Secrets Mgr</text><path d="M694,565 L694,588" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="554" y="740" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">VPC CNI: every pod gets a real VPC IP address, so the private subnets are big (/20 = 4,096 IPs each)</text><text x="554" y="765" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">One NAT gateway saves $0.045/h; production uses one per zone</text><rect x="890" y="250" width="306" height="100" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1043.0" y="288.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">S3 buckets (versioned, KMS)</text><text x="1043.0" y="305.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops: raw/, datasets/, mlflow/, argo/</text><text x="1043.0" y="322.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">models: published models, llm/ weights</text><rect x="890" y="375" width="306" height="85" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1043.0" y="405.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ECR registries</text><text x="1043.0" y="422.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">assistant, classifier, trainer, mlflow</text><text x="1043.0" y="439.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">immutable tags · scan on push</text><rect x="890" y="485" width="306" height="130" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="1043.0" y="521.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">IAM roles via Pod Identity</text><text x="1043.0" y="538.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute/classifier → read models</text><text x="1043.0" y="555.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute/llm → read models/llm/</text><text x="1043.0" y="572.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops/trainer → write models</text><text x="1043.0" y="589.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mlops/mlflow → mlops/mlflow/  ·  no keys</text><rect x="890" y="640" width="306" height="80" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="1043.0" y="676.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">KMS key (ours)</text><text x="1043.0" y="693.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">encrypts S3, Secrets, RDS, ECR</text><path d="M844,300 L888,300" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="866" y="290" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">S3</text><path d="M844,417 L888,417" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="866" y="407" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">pull</text><path d="M824,520 L888,540" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="858" y="518" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">role</text><rect x="30" y="884" width="16" height="16" rx="4" fill="#e8f0fe" stroke="#4a7bd0"/><text x="54" y="897" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Always-on compute (on-demand)</text><rect x="290" y="884" width="16" height="16" rx="4" fill="#f1e8fd" stroke="#7b52c7"/><text x="314" y="897" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Spot / AWS-managed</text><rect x="550" y="884" width="16" height="16" rx="4" fill="#fef3e0" stroke="#c98a1b"/><text x="574" y="897" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Storage + images</text><rect x="810" y="884" width="16" height="16" rx="4" fill="#fde8e8" stroke="#c0392b"/><text x="834" y="897" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Access (IAM)</text></svg>
