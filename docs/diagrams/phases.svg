<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="480" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Thirteen phases, four milestones</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Each phase ends with something working and one interview story. Thick border = next</text><rect x="24" y="90" width="172" height="78" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="3"/><text x="110.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P0 Foundations</text><text x="110.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">budget, OIDC, GPU quota</text><rect x="230" y="90" width="172" height="78" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="316.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P1 Local LLM</text><text x="316.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">kind + Ollama + app</text><rect x="436" y="90" width="172" height="78" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="522.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P2 Eval + traces</text><text x="522.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">golden set, gate, OTel</text><rect x="642" y="90" width="172" height="78" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="728.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P3 Terraform</text><text x="728.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">VPC, EKS, node groups</text><rect x="848" y="90" width="172" height="78" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="934.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P4 LLM serving</text><text x="934.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">KServe · CPU → GPU</text><rect x="1054" y="90" width="172" height="78" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="1140.0" y="125.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P5 Gateway</text><text x="1140.0" y="142.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LiteLLM, guardrails</text><rect x="1054" y="290" width="172" height="78" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="1140.0" y="325.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P6 CI/CD</text><text x="1140.0" y="342.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">eval gate → GitOps</text><rect x="848" y="290" width="172" height="78" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="934.0" y="325.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P7 Observe</text><text x="934.0" y="342.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">TTFT, GPU, tokens</text><rect x="642" y="290" width="172" height="78" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="728.0" y="325.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">P8 Scale + cost</text><text x="728.0" y="342.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">KEDA, Karpenter, k6</text><rect x="436" y="290" width="172" height="78" rx="10" fi