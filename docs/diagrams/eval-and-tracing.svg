<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1240" height="640" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">P3: evaluation gate and tracing</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Top: every request is one trace, one span per step. Bottom: a change ships only if the golden set still passes</text><rect x="24" y="80" width="1192" height="210" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="100" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">One request = one trace in Phoenix (OpenTelemetry). Each box is a span with its timing</text><rect x="44" y="135" width="150" height="100" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="119.0" y="181.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">POST /assist</text><text x="119.0" y="198.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">claim text</text><rect x="240" y="135" width="180" height="100" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="330.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">guardrail_input</text><text x="330.0" y="190.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">mask card, phone,</text><text x="330.0" y="207.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">account, SIN, email</text><path d="M196,185 L238,185" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="455" y="135" width="180" height="100" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="545.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">classify</text><text x="545.0" y="190.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">label + confidence</text><text x="545.0" y="207.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">+ model version</text><path d="M422,185 L453,185" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="670" y="135" width="180" height="100" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="760.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">policy_lookup</text><text x="760.0" y="190.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">policy text for</text><text x="760.0" y="207.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">that label</text><path d="M637,185 L668,185" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="885" y="135" width="180" height="100" rx="10" fill="#f1e8fd" stroke="#7b52c7" stroke-width="1.6"/><text x="975.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">llm</text><text x="975.0" y="190.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">messages, tokens,</text><text x="975.0" y="207.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt version</text><path d="M852,185 L883,185" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1100" y="135" width="100" height="100" rx="10" fill="#e6f4ea" stroke="#3b8a52" stroke-width="1.6"/><text x="1150.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Reply</text><text x="1150.0" y="190.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">+ trace_id</text><text x="1150.0" y="207.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">+ lineage</text><path d="M1065,185 L1098,185" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545" y="262" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">classifier service adds its own span (trace ID passed in the HTTP header)</text><rect x="24" y="320" width="1192" height="230" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="340" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">make eval [PROMPT=candidate]: like a CI preview environment</text><rect x="44" y="380" width="200" height="110" rx="10" fill="#e0f5f5" stroke="#1f8a8a" stroke-width="1.6"/><text x="144.0" y="414.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Golden set</text><text x="144.0" y="431.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">60 hand-written claims:</text><text x="144.0" y="448.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">clear, hard, PII,</text><text x="144.0" y="465.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">prompt injection</text><rect x="290" y="380" width="200" height="110" rx="10" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="390.0" y="414.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Assistant</text><text x="390.0" y="431.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">candidate deployed,</text><text x="390.0" y="448.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">every claim sent</text><text x="390.0" y="465.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(2 at a time)</text><rect x="536" y="360" width="230" height="150" rx="10" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.6"/><text x="651.0" y="389.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Checks per reply</text><text x="651.0" y="406.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dispute type right?</text><text x="651.0" y="423.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">policy facts present?</text><text x="651.0" y="440.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">personal details repeated?</text><text x="651.0" y="457.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">refund promised?</text><text x="651.0" y="474.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">numbers invented?</text><text x="651.0" y="491.0" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">latency</text><rect x="812" y="380" width="180" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="902.0" y="414.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">LLM judge</text><text x="902.0" y="431.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">counts only if it agrees</text><text x="902.0" y="448.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">with human labels</text><text x="902.0" y="465.5" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(calibration set)</text><polygon points="1100,380 1180,435 1100,490 1020,435" fill="#fef3e0" stroke="#c98a1b" stroke-width="1.6"/><text x="1100" y="440" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Gate</text><path d="M244,435 L288,435" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M490,435 L534,435" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M766,435 L810,435" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M992,435 L1018,435" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1100" y="520" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">pass: ship · fail: exit 1</text><path d="M390,380 L390,300" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="480" y="312" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">trace link per failing case</text><rect x="30" y="599" width="16" height="16" rx="4" fill="#fde8e8" stroke="#c0392b"/><text x="54" y="612" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Guardrail (masks before any model)</text><rect x="290" y="599" width="16" height="16" rx="4" fill="#e8f0fe" stroke="#4a7bd0"/><text x="314" y="612" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Model / checks</text><rect x="550" y="599" width="16" height="16" rx="4" fill="#e0f5f5" stroke="#1f8a8a"/><text x="574" y="612" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Data</text><rect x="810" y="599" width="16" height="16" rx="4" fill="#fef3e0" stroke="#c98a1b"/><text x="834" y="612" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">System under test</text></svg>
